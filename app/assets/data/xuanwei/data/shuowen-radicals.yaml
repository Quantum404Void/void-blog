  - radical: 鬥
    strokes: 10
    def: 两士相对，兵杖在后，象鬥之形。
    pinyin: dòu
  - radical: 鬯
    strokes: 10
    def: 以秬酿𩪍艸，芬芳攸服，以降神也。
    pinyin: chàng
  - radical: 鬲
    strokes: 10
    def: 鼎属。实五觳。斗二升曰觳。象腹交文，三足。
    pinyin: lì
  - radical: 鬼
    strokes: 10
    def: 人所归为鬼。从人，象鬼头。鬼阴气贼害，从厶。
    pinyin: guǐ
  - radical: 魚
    strokes: 11
    def: 水虫也。象形。鱼尾与燕尾相似。
    pinyin: yú
  - radical: 鳥
    strokes: 11
    def: 长尾禽总名也。象形。鸟之足似匕，从匕。
    pinyin: niǎo
  - radical: 鹵
    strokes: 11
    def: 西方咸地也。从西省，象盐形。
    pinyin: lǔ
  - radical: 鹿
    strokes: 11
    def: 兽也。象头角四足之形。鸟鹿足相似，从匕。
    pinyin: lù
  - radical: 麥
    strokes: 11
    def: 芒谷，秋穜厚薶，故谓之麦。从来，有穗者；从夊。
    pinyin: mài
  - radical: 麻
    strokes: 11
    def: 与𣏟同。人所治，在屋下。从广从𣏟。
    pinyin: má
  - radical: 黄
    strokes: 12
    def: 地之色也。从田从炗，炗亦声。
    pinyin: huáng
  - radical: 黍
    strokes: 12
    def: 禾属而黏者也。以大暑而穜，故谓之黍。从禾，雨省声。
    pinyin: shǔ
  - radical: 黑
    strokes: 12
    def: 火所熏之色也。从炎，上出𡆧。
    pinyin: hēi
  - radical: 黹
    strokes: 12
    def: 箴缕所紩衣。从㡀，丵省。
    pinyin: zhǐ
  - radical: 黽
    strokes: 13
    def: 鼃黽也。从它，象形。黽头与它头同。
    pinyin: mǐn
  - radical: 鼎
    strokes: 13
    def: 三足两耳，和五味之宝器也。象析木以炊也。
    pinyin: dǐng
  - radical: 鼓
    strokes: 13
    def: 郭也。春分之音，万物郭皮甲而出，故谓之鼓。从壴，支象其手击之也。
    pinyin: gǔ
  - radical: 鼠
    strokes: 13
    def: 穴虫之总名也。象形。
    pinyin: shǔ
  - radical: 鼻
    strokes: 14
    def: 引气自𢌿也。从自𢌿。
    pinyin: bí
  - radical: 齊
    strokes: 14
    def: 禾麦吐穗上平也。象形。
    pinyin: qí
  - radical: 齒
    strokes: 15
    def: 口龂骨也。象口齿之形，止声。
    pinyin: chǐ
  - radical: 龍
    strokes: 16
    def: 鳞虫之长。能幽能明，能细能巨，能短能长。春分而登天，秋分而潜渊。
    pinyin: lóng
  - radical: 龜
    strokes: 16
    def: 旧也。外骨内肉者也。从它，龟头与它头同。
    pinyin: guī
  - radical: 龠
    strokes: 17
    def: 乐之竹管，三孔，以和众声也。从品仑。仑，理也。
    pinyin: yuè
