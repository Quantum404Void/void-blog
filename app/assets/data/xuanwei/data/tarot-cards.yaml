majorArcana:
  - id: tarot-0
    name: 愚者
    number: 0
    element: 风
    planet: 天王星
    meaning: 新的开始、冒险、天真
    desc: The Fool — 新的旅程，无限可能
  - id: tarot-1
    name: 魔术师
    number: 1
    element: 风
    planet: 水星
    meaning: 创造力、技能、自信
    desc: The Magician — 拥有将想法变为现实的能力
  - id: tarot-2
    name: 女祭司
    number: 2
    element: 水
    planet: 月亮
    meaning: 直觉、智慧、神秘
    desc: The High Priestess — 倾听内心的声音
  - id: tarot-3
    name: 女皇
    number: 3
    element: 土
    planet: 金星
    meaning: 丰饶、母性、美
    desc: The Empress — 丰收的季节
  - id: tarot-4
    name: 皇帝
    number: 4
    element: 火
    planet: 白羊座
    meaning: 权威、秩序、稳定
    desc: The Emperor — 建立规则与秩序
  - id: tarot-5
    name: 教皇
    number: 5
    element: 土
    planet: 金牛座
    meaning: 传统、信仰、指导
    desc: The Hierophant — 遵循内心的信念
  - id: tarot-6
    name: 恋人
    number: 6
    element: 风
    planet: 双子座
    meaning: 选择、爱情、和谐
    desc: The Lovers — 重要的选择时刻
  - id: tarot-7
    name: 战车
    number: 7
    element: 水
    planet: 巨蟹座
    meaning: 意志力、胜利、前进
    desc: The Chariot — 坚定的意志是最大的武器
  - id: tarot-8
    name: 力量
    number: 8
    element: 火
    planet: 狮子座
    meaning: 勇气、内在力量、耐心
    desc: Strength — 真正的力量来自内心
  - id: tarot-9
    name: 隐士
    number: 9
    element: 土
    planet: 处女座
    meaning: 内省、智慧、孤独
    desc: The Hermit — 暂别喧嚣
  - id: tarot-10
    name: 命运之轮
    number: 10
    element: 火
    planet: 木星
    meaning: 命运、转折、机遇
    desc: Wheel of Fortune — 命运之轮转动
  - id: tarot-11
    name: 正义
    number: 11
    element: 风
    planet: 天秤座
    meaning: 公正、因果、平衡
    desc: Justice — 种什么因得什么果
  - id: tarot-12
    name: 倒吊人
    number: 12
    element: 水
    planet: 海王星
    meaning: 牺牲、换个角度、等待
    desc: The Hanged Man — 换个角度看世界
  - id: tarot-13
    name: 死神
    number: 13
    element: 水
    planet: 天蝎座
    meaning: 结束、转变、新生
    desc: Death — 旧的不去新的不来
  - id: tarot-14
    name: 节制
    number: 14
    element: 火
    planet: 射手座
    meaning: 调和、适度、平衡
    desc: Temperance — 不疾不徐
  - id: tarot-15
    name: 恶魔
    number: 15
    element: 土
    planet: 摩羯座
    meaning: 束缚、欲望、物质
    desc: The Devil — 看清束缚你的枷锁
  - id: tarot-16
    name: 高塔
    number: 16
    element: 火
    planet: 火星
    meaning: 突变、崩塌、觉醒
    desc: The Tower — 旧结构崩塌
  - id: tarot-17
    name: 星星
    number: 17
    element: 风
    planet: 水瓶座
    meaning: 希望、治愈、宁静
    desc: The Star — 希望之光始终照耀
  - id: tarot-18
    name: 月亮
    number: 18
    element: 水
    planet: 双鱼座
    meaning: 潜意识、恐惧、幻觉
    desc: The Moon — 面对内心的阴影
  - id: tarot-19
    name: 太阳
    number: 19
    element: 火
    planet: 太阳
    meaning: 快乐、成功、活力
    desc: The Sun — 阳光普照
  - id: tarot-20
    name: 审判
    number: 20
    element: 火
    planet: 冥王星
    meaning: 觉醒、召唤、重生
    desc: Judgement — 听从内心的召唤
  - id: tarot-21
    name: 世界
    number: 21
    element: 土
    planet: 土星
    meaning: 完成、圆满、旅程
    desc: The World — 一个循环的圆满结束
